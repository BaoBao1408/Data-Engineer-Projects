# ──────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
#
# CI/CD Pipeline — AdStart Media Daily ETL
#
# Triggers:
#   - Push to main / develop
#   - Pull Request to main
#   - Manual dispatch (with optional --date override)
#
# Jobs:
#   1. lint      → ruff / black check (fast fail)
#   2. test      → pytest unit + integration (in Docker)
#   3. build     → docker build + push to GHCR
#   4. run-date  → manual backfill trigger (workflow_dispatch only)
# ──────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "part3_pipeline_AWS_Service/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "part3_pipeline_AWS_Service/**"

  # Manual trigger — useful for backfills or prod runs
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date to process (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/adstart-pipeline
  WORKING_DIR: part3_pipeline_AWS_Service

defaults:
  run:
    working-directory: part3_pipeline_AWS_Service

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint (runs on host — fastest feedback, no Docker needed)
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint check
        run: ruff check src/ config/ tests/ --output-format=github

  # ──────────────────────────────────────────────────────────────
  # Job 2: Tests (inside Docker — matches production environment)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            -f deployment/Dockerfile \
            -t adstart-pipeline:test \
            --target runtime \
            .

      - name: Run pytest inside container
        run: |
          docker run --rm \
            -e PYTHONUTF8=1 \
            -e PIPELINE_ENV=local \
            adstart-pipeline:test \
            pytest tests/ -v --tb=short --junitxml=/tmp/test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/test-results.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build & Push Docker image (main branch only)
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Set up Docker Buildx (enables layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 4: Manual backfill run (workflow_dispatch only)
  # Runs the pipeline for a specific date in a container
  # ──────────────────────────────────────────────────────────────
  run-pipeline:
    name: Run Pipeline (manual dispatch)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run pipeline
        run: |
          DATE_ARG="${{ github.event.inputs.run_date }}"
          if [ -n "$DATE_ARG" ]; then
            EXTRA="--date $DATE_ARG"
          else
            EXTRA=""
          fi

          docker run --rm \
            -e PYTHONUTF8=1 \
            -e PIPELINE_ENV=local \
            -v ${{ github.workspace }}/${{ env.WORKING_DIR }}/data/raw:/app/data/raw:ro \
            -v ${{ github.workspace }}/${{ env.WORKING_DIR }}/data/warehouse:/app/data/warehouse \
            -v ${{ github.workspace }}/${{ env.WORKING_DIR }}/logs:/app/logs \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest $EXTRA
