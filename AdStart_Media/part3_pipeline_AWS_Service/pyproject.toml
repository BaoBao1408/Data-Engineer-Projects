[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "adstart-pipeline"
version         = "0.1.0"
description     = "AdStart Media daily ETL pipeline — operator billing data → DuckDB warehouse"
requires-python = ">=3.11"
dependencies    = [
    "duckdb>=0.10.0,<1.0.0",
    "prefect>=2.14.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
aws = [
    "awswrangler>=3.5.0",
    "boto3>=1.34.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
generate-data = "generate_mock_data:main"

[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions= ["test_*"]
addopts         = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "data*", "logs*"]