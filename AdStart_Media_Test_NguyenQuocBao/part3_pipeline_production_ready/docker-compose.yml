version: "3.9"

services:
  adstart-pipeline:
    build:
      context: .
      dockerfile: deployment/Dockerfile

    container_name: adstart_pipeline

    volumes:
      - ./data/raw:/app/data/raw
      - ./data/warehouse:/app/data/warehouse
      - ./logs:/app/logs

    environment:
      DB_PATH: /app/data/warehouse/warehouse.duckdb
      LOG_LEVEL: INFO

    command: >
      sh -c "
      pytest tests/ -v &&
      python src/orchestration/pipeline.py --date 2026-01-15
      "

    restart: unless-stopped