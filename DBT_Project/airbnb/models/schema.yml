models:
    - name: dim_listings_cleaned
      description: Primary key for the listing
      columns:
        - name: listing_id
          data_tests: 
            - unique
            - not_null

        - name: host_id
          description: The hosts's id. References the host table.
          data_tests:
            - not_null
            - relationships:
                arguments:
                    to: ref('dim_hosts_cleaned')
                    field: host_id

        - name: room_type
          description: Type of the apartment / room
          data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room - break this!']
