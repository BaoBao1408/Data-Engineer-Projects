name: CI – Build, Lint, Test

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Lint & Static Analysis ───────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy black isort

      - name: Ruff lint
        run: ruff check src/ airflow/ tests/

      - name: Black format check
        run: black --check src/ airflow/ tests/

      - name: isort import order check
        run: isort --check-only src/ airflow/ tests/

  # ─── Unit Tests ───────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
                      -r requirements-api.txt \
                      -r requirements-ingestion.txt \
                      -r requirements-etl.txt \
                      pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          ENV: testing
          DATABASE_URL: sqlite:///test.db
          NEO4J_URI: bolt://localhost:7687
          MINIO_ENDPOINT: localhost:9000

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Integration Tests ────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edp_user
          POSTGRES_PASSWORD: edp_pass
          POSTGRES_DB: edp_warehouse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/neo4j_pass
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 7687:7687

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio_admin
          MINIO_ROOT_PASSWORD: minio_secret
        options: >-
          --health-cmd "mc ready local"
          --health-interval 10s
        ports:
          - 9000:9000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
                      -r requirements-api.txt \
                      -r requirements-ingestion.txt \
                      -r requirements-etl.txt \
                      pytest pytest-asyncio httpx

      - name: Run migrations
        run: |
          psql postgresql://edp_user:edp_pass@localhost:5432/edp_warehouse_test \
               -f src/warehouse/migrations/001_financial_schema.sql
        env:
          PGPASSWORD: edp_pass

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120
        env:
          ENV: testing
          DATABASE_URL: postgresql://edp_user:edp_pass@localhost:5432/edp_warehouse_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: neo4j_pass
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minio_admin
          MINIO_SECRET_KEY: minio_secret
          MINIO_SECURE: "false"

  # ─── Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: edp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
            VERSION=ci

      - name: Build Ingestion image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ingestion
          push: false
          tags: edp-ingestion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
