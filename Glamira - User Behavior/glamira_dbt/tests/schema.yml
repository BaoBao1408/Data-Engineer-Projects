version: 2

models:
  - name: gold_dim_product
    columns:
      - name: product_key
        tests:
          - not_null
          - unique

  - name: gold_dim_store
    columns:
      - name: store_key
        tests:
          - not_null
          - unique

  - name: gold_fact_sale
    columns:
      - name: event_id
        tests:
          - not_null[]

  - name: gold_dim_customer
    columns:
      - name: customer_key
        tests:
          - not_null[]
          - unique

  - name: gold_dim_location
    columns:
      - name: location_key
        tests:
          - not_null[]
          - unique