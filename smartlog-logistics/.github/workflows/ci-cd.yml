name: CI/CD Pipeline — Smartlog

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smartlog

jobs:
  # ══════════════════════════════════════════════════════════
  # JOB 1: BUILD & TEST
  # ══════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartlog
          POSTGRES_PASSWORD: smartlog123
          POSTGRES_DB: orderdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore SmartlogLogistics.sln

      - name: Build
        run: dotnet build SmartlogLogistics.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test SmartlogLogistics.sln --no-build -c Release --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=orderdb;Username=smartlog;Password=smartlog123"

  # ══════════════════════════════════════════════════════════
  # JOB 2: DOCKER BUILD & PUSH (main branch only)
  # ══════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push OrderService
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OrderService/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-order-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-order-service:${{ github.sha }}
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service

      - name: Build & Push TrackingService
        uses: docker/build-push-action@v5
        with:
          context: .
          file: TrackingService/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tracking-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-tracking-service:${{ github.sha }}
          cache-from: type=gha,scope=tracking-service
          cache-to: type=gha,mode=max,scope=tracking-service

  # ══════════════════════════════════════════════════════════
  # JOB 3: DEPLOY TO AWS ECS
  # ══════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS — OrderService
        run: |
          aws ecs update-service \
            --cluster smartlog-cluster \
            --service order-service \
            --force-new-deployment \
            --region ap-southeast-1
          echo "✅ OrderService deployment triggered"

      - name: Update ECS — TrackingService
        run: |
          aws ecs update-service \
            --cluster smartlog-cluster \
            --service tracking-service \
            --force-new-deployment \
            --region ap-southeast-1
          echo "✅ TrackingService deployment triggered"

      - name: Wait for services stable
        run: |
          aws ecs wait services-stable \
            --cluster smartlog-cluster \
            --services order-service tracking-service \
            --region ap-southeast-1
          echo "✅ All services stable"

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Services**: OrderService, TrackingService" >> $GITHUB_STEP_SUMMARY
