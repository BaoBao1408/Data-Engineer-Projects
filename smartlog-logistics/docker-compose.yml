version: '3.9'

networks:
  smartlog-net:
    driver: bridge

volumes:
  kafka_data:
  zookeeper_data:

services:

  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE LAYER
  # ═══════════════════════════════════════════════════════════

  react-frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: smartlog-frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - smartlog-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smartlog-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - smartlog-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartlog-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      # ✅ FIX: Đảm bảo coordinator ready nhanh hơn
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smartlog-net
    healthcheck:
      # ✅ FIX: healthcheck mạnh hơn — kiểm tra cả topic metadata, không chỉ broker API
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 && kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartlog-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlog-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - smartlog-net

  # ═══════════════════════════════════════════════════════════
  # APPLICATION LAYER
  # ═══════════════════════════════════════════════════════════

  order-service:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: smartlog-order-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5001:8080"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # PostgreSQL: trỏ vào local PostgreSQL trên máy Windows
      ConnectionStrings__DefaultConnection: >
        Host=host.docker.internal;Port=5432;Database=orderdb;
        Username=postgres;Password=123456
      Kafka__BootstrapServers: kafka:9092
      # ✅ FIX: Tắt idempotence để tránh lỗi "Failed to acquire idempotence PID"
      # Idempotent producer cần TRANSACTION coordinator fully loaded — gây race condition lúc startup
      Kafka__EnableIdempotence: "false"
      Jwt__Secret: ${JWT_SECRET:-dev-secret-key-min-32-characters-long!!}
      Jwt__Issuer: ${JWT_ISSUER:-smartlog-api}
      Jwt__Audience: ${JWT_AUDIENCE:-smartlog-frontend}
      AWS__AccessKeyId: ${AWS_ACCESS_KEY_ID:-}
      AWS__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-}
      AWS__Region: ${AWS_REGION:-ap-southeast-1}
      AWS__S3Bucket: ${AWS_S3_BUCKET:-smartlog-logistics-files}
    networks:
      - smartlog-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # ✅ FIX: tăng start_period để Kafka coordinator đủ thời gian load
      start_period: 60s

  tracking-service:
    build:
      context: .
      dockerfile: TrackingService/Dockerfile
    container_name: smartlog-tracking-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5002:8080"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # PostgreSQL: trỏ vào local PostgreSQL trên máy Windows
      ConnectionStrings__DefaultConnection: >
        Host=host.docker.internal;Port=5432;Database=trackingdb;
        Username=postgres;Password=123456
      Kafka__BootstrapServers: kafka:9092
      Jwt__Secret: ${JWT_SECRET:-dev-secret-key-min-32-characters-long!!}
      Jwt__Issuer: ${JWT_ISSUER:-smartlog-api}
      Jwt__Audience: ${JWT_AUDIENCE:-smartlog-frontend}
    networks:
      - smartlog-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════
  # GATEWAY LAYER
  # ═══════════════════════════════════════════════════════════

  nginx:
    image: nginx:alpine
    container_name: smartlog-gateway
    depends_on:
      - order-service
      - tracking-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smartlog-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # FRONTEND Angular (uncomment khi cần)
  # ═══════════════════════════════════════════════════════════

