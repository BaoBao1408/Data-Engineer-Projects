events { worker_connections 1024; }

http {
    upstream order_service   { server order-service:8080; }
    upstream tracking_service { server tracking-service:8080; }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # ── Order API ──────────────────────────────────────
        location /api/orders {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/auth {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Tracking API ───────────────────────────────────
        location /api/tracking {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://tracking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Swagger passthroughs ───────────────────────────
        location ~ ^/swagger/orders(.*)$ {
            proxy_pass http://order_service/swagger$1;
            proxy_set_header Host $host;
        }

        location ~ ^/swagger/tracking(.*)$ {
            proxy_pass http://tracking_service/swagger$1;
            proxy_set_header Host $host;
        }

        # ── Health checks ──────────────────────────────────
        location /health/orders   { proxy_pass http://order_service/health; }
        location /health/tracking { proxy_pass http://tracking_service/health; }

        # ── Frontend Angular (enable when frontend ready) ──
        # location / {
        #     proxy_pass http://angular-frontend:80;
        #     proxy_set_header Host $host;
        #     try_files $uri $uri/ /index.html;
        # }

        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
